name: "CodeQL Analysis (C#)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  analyze-csharp:
    name: CodeQL (C# / .NET 10)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DOTNET_CLI_FORCE_UTF8_ENCODING: "1"
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Solution for CodeQL
        env:
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
        # App.csproj 已固定 RuntimeIdentifier=win-x64；不可加 -r，否則相依專案的 packages.lock.json 會因 RID 不符而在 locked mode 還原失敗
        run: dotnet build src/MinecraftServerManager.App/MinecraftServerManager.App.csproj -p:UseSharedCompilation=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
          upload: true
