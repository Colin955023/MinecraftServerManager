name: "CodeQL Analysis (C#)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  analyze-csharp:
    name: CodeQL (C#)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_FORCE_UTF8_ENCODING: "1"
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Solution for CodeQL
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: dotnet build src/MinecraftServerManager.App/MinecraftServerManager.App.csproj -p:UseSharedCompilation=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:csharp"
          upload: true
