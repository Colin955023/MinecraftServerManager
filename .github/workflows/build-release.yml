name: Build and Create Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  preflight:
    name: 發布前置輕量預檢 (Preflight)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag_name: ${{ steps.extract_notes.outputs.tag_name }}
      version: ${{ steps.extract_notes.outputs.version }}
    steps:
      - name: 確認於 master 分支執行
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
              throw "發布僅允許於 master 執行，目前為 $env:GITHUB_REF"
          }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version and verify CHANGELOG
        id: extract_notes
        run: ./scripts/extract_release_notes.ps1

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release_notes
          path: release_notes.md
          if-no-files-found: error
          retention-days: 1

      - name: Verify Tag Availability
        env:
          RELEASE_TAG: ${{ steps.extract_notes.outputs.tag_name }}
        run: |
          . ./scripts/lib/Common.ps1
          if (Test-ReleaseTagAtHead -Tag $env:RELEASE_TAG) {
              Write-Host "Tag $env:RELEASE_TAG 已存在且指向目前 HEAD；將沿用該標籤建立 Release。"
          } else {
              Write-Host "Tag $env:RELEASE_TAG 尚未建立，可安全建立新標籤發布。"
          }

      - name: 確認 master HEAD 的 CI 工作流已全數完成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 品質門禁、CodeQL、機密掃描已於 push 到 master 時執行，發布流程不重複建置驗證，僅確認同一 commit 的結果
          # 必要工作流以 workflow 的 name 比對，更名時須同步修改此清單
          $required = @('CI', 'CodeQL Analysis')
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA `
              --limit 100 --json workflowName,event,status,conclusion,createdAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '無法查詢 workflow runs' }

          # 推送與手動重跑皆採計，各工作流取最新一次
          $latest = @($runs |
              Where-Object { $_.workflowName -in $required -and $_.event -in 'push', 'workflow_dispatch' } |
              Sort-Object createdAt -Descending | Group-Object workflowName | ForEach-Object { $_.Group[0] })
          $pending = @($latest | Where-Object { $_.status -ne 'completed' })
          if ($pending.Count -gt 0) {
              throw "master HEAD 尚有未完成的必要工作流：$($pending.workflowName -join ', ')，請待其完成後再發布"
          }

          foreach ($name in $required) {
              $run = $latest | Where-Object { $_.workflowName -eq $name }
              if ($null -eq $run -or $run.conclusion -ne 'success') {
                  throw "工作流 [$name] 在 $env:GITHUB_SHA 上未成功或尚未執行，禁止發布"
              }
              Write-Host "[$name] 已成功"
          }

  build:
    name: Publish and Attest
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Publish Single Executable (Self-contained)
        run: ./scripts/dotnet_publish.ps1

      - name: Generate SBOM (SPDX)
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SBOM_TOOL_VERSION: v4.1.5
          SBOM_TOOL_SHA256: 625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5
        run: |
          # 釘選 Microsoft SBOM Tool 固定發行版本與 SHA-256 雜湊，確保建置可重現性與防竄改
          $versionTag = $env:SBOM_TOOL_VERSION
          $expectedSha = $env:SBOM_TOOL_SHA256.ToUpperInvariant()
          $downloadUrl = "https://github.com/microsoft/sbom-tool/releases/download/$versionTag/sbom-tool-win-x64.exe"

          $sbomToolPath = Join-Path $env:RUNNER_TEMP "sbom-tool-win-x64.exe"
          . ./scripts/lib/Common.ps1
          Write-Host "正在下載 Microsoft SBOM Tool $versionTag..."
          Invoke-WithRetry -Description "下載 SBOM Tool" -Action { Invoke-WebRequest -Uri $downloadUrl -OutFile $sbomToolPath }
          $actualSha = (Get-FileHash -LiteralPath $sbomToolPath -Algorithm SHA256).Hash
          if ($actualSha -ne $expectedSha) {
              Remove-Item -LiteralPath $sbomToolPath -Force
              throw "SBOM Tool SHA-256 不符：預期 $expectedSha，實際 $actualSha"
          }

          $version = $env:RELEASE_VERSION
          Write-Host "正在為版本 $version 產生 SPDX SBOM..."
          & $sbomToolPath generate -b "output" -bc "src" -pn "MinecraftServerManager" -pv $version -ps "Colin955023" -nsb "https://github.com/Colin955023/MinecraftServerManager" -mi "SPDX:2.2"
          if ($LASTEXITCODE -ne 0) {
              throw "SBOM 產生失敗"
          }

          # 不假設輸出子目錄名稱（會隨工具版本變動），改以檔名搜尋，並驗證實際的 spdxVersion
          $spdxFile = Get-ChildItem -LiteralPath "output/_manifest" -Recurse -Filter "manifest.spdx.json" -File | Select-Object -First 1
          if ($null -eq $spdxFile) {
              throw "SPDX 清單檔案未產生"
          }
          $spdxVersion = (Get-Content -LiteralPath $spdxFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json).spdxVersion
          if ($spdxVersion -ne "SPDX-2.2") {
              throw "SBOM 格式版本不符：預期 SPDX-2.2，實際 $spdxVersion"
          }

          $destSbom = "output/MinecraftServerManager.spdx.json"
          Copy-Item -LiteralPath $spdxFile.FullName -Destination $destSbom -Force
          Remove-Item -LiteralPath "output/_manifest" -Recurse -Force
          # SBOM 只描述執行檔，雜湊檔於 SBOM 產生後才寫入
          foreach ($file in "output/MinecraftServerManager.exe", $destSbom) {
              $null = Write-Sha256File -LiteralPath $file
          }
          Write-Host "SBOM 與 SHA-256 產生完成: $destSbom (SBOM Tool $versionTag)"

      - name: Attest release artifacts provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            output/*.exe
            output/*.spdx.json

      - name: Export SLSA provenance for GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/lib/Common.ps1
          Get-ChildItem -LiteralPath 'output' -Filter '*.exe' -File | ForEach-Object {
              $exe = $_
              $tempDir = Join-Path $env:RUNNER_TEMP ("attestation-" + [guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Path $tempDir -Force | Out-Null

              Push-Location -LiteralPath $tempDir
              try {
                  Invoke-WithRetry -Description "下載 $($exe.Name) 的 SLSA provenance" -Action {
                      gh attestation download $exe.FullName `
                        --repo $env:GITHUB_REPOSITORY `
                        --predicate-type 'https://slsa.dev/provenance/v1' `
                        --limit 1
                  }

                  $bundles = @(Get-ChildItem -LiteralPath $tempDir -Filter '*.jsonl' -File)
                  if ($bundles.Count -ne 1) {
                      throw "Expected exactly one SLSA provenance bundle for $($exe.Name), found $($bundles.Count)"
                  }

                  $destination = Join-Path $exe.DirectoryName ($exe.Name + '.intoto.jsonl')
                  Copy-Item -LiteralPath $bundles[0].FullName -Destination $destination -Force
              }
              finally {
                  Pop-Location
                  Remove-Item -LiteralPath $tempDir -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release_payload
          path: output/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release_payload
          path: output

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release_notes

      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/lib/Common.ps1
          $tag = $env:RELEASE_TAG
          # 重新驗證，避免 Preflight 之後有人建立指向其他 commit 的同名標籤
          if (Test-ReleaseTagAtHead -Tag $tag) {
              Write-Host "Tag $tag 已存在且指向目前 HEAD，略過建立。"
              exit 0
          }

          $headCommit = Get-HeadCommit

          $tagRequest = @{
              tag = $tag
              message = $tag
              object = $headCommit
              type = 'commit'
          } | ConvertTo-Json -Compress
          $tagResponseJson = $tagRequest | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" --input -
          if ($LASTEXITCODE -ne 0) {
              Write-Error "建立 annotated tag object 失敗：$tag"
              exit $LASTEXITCODE
          }

          $tagResponse = $tagResponseJson | ConvertFrom-Json
          if (-not $tagResponse.sha) {
              Write-Error "GitHub API 未回傳 tag object SHA：$tag"
              exit 1
          }

          $refRequest = @{
              ref = "refs/tags/$tag"
              sha = $tagResponse.sha
          } | ConvertTo-Json -Compress
          $null = $refRequest | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" --input -
          if ($LASTEXITCODE -ne 0) {
              Write-Error "建立 tag ref 失敗：$tag"
              exit $LASTEXITCODE
          }

          Write-Host "Created annotated tag: $tag -> $headCommit"

      - name: Create Draft Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/lib/Common.ps1
          $tag = $env:RELEASE_TAG
          $prereleaseArgs = @()
          if ($tag -match '^v?\d+\.\d+\.\d+-') { $prereleaseArgs += '--prerelease' }

          # 重新執行時清除先前失敗留下的草稿；已公開的 Release 一律禁止覆蓋
          $viewOutput = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>&1
          if ($LASTEXITCODE -ne 0) {
              if ("$viewOutput" -notmatch 'release not found') {
                  throw "查詢 Release $tag 失敗：$viewOutput"
              }
          } else {
              $existing = "$viewOutput" | ConvertFrom-Json
              if (-not $existing.isDraft) {
                  throw "Release $tag 已公開發布，禁止覆蓋"
              }
              Write-Host "刪除先前未完成的草稿 Release $tag（保留標籤）"
              gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "刪除草稿 Release $tag 失敗" }
          }
          $global:LASTEXITCODE = 0

          Assert-ReleaseAssets -Directory 'output'
          $assets = @(Get-ReleaseAssetNames | ForEach-Object { Join-Path 'output' $_ })
          $ghArgs = @('release', 'create', $tag) + $assets + @(
              '--title', "Minecraft Server Manager $tag",
              '--notes-file', 'release_notes.md',
              '--verify-tag',
              '--draft'
          ) + $prereleaseArgs

          Write-Host "Executing: gh $ghArgs"
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
              Write-Error "GitHub CLI failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Verify Draft Release Assets End-to-End
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/lib/Common.ps1
          $tag = $env:RELEASE_TAG
          Write-Host "=== 開始對草稿 Release $tag 進行端對端資產驗證 ==="
          $verifyDir = Join-Path $env:RUNNER_TEMP "release-verify"
          if (Test-Path -LiteralPath $verifyDir) {
              Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null

          try {
              Write-Host "正在自 GitHub Release 下載資產至驗證目錄..."
              Invoke-WithRetry -Description "下載 Release $tag 資產" -Action {
                  gh release download $tag --dir $verifyDir --repo $env:GITHUB_REPOSITORY --clobber
              }

              $downloadedFiles = @(Get-ChildItem -LiteralPath $verifyDir -File)
              Write-Host "成功下載 $($downloadedFiles.Count) 個發布資產："
              $downloadedFiles | Select-Object Name, Length | Format-Table -AutoSize

              Assert-ReleaseAssets -Directory $verifyDir

              $exeFiles = @(Get-ChildItem -LiteralPath $verifyDir -Filter '*.exe' -File)
              if ($exeFiles.Count -ne 1) {
                  throw "驗證失敗：預期 1 個 .exe，實際找到 $($exeFiles.Count) 個"
              }

              $expectedShaCount = @(Get-ReleaseAssetNames | Where-Object { $_ -like '*.sha256' }).Count
              $shaFiles = @(Get-ChildItem -LiteralPath $verifyDir -Filter '*.sha256' -File)
              if ($shaFiles.Count -ne $expectedShaCount) {
                  throw "驗證失敗：預期 $expectedShaCount 個 .sha256，實際找到 $($shaFiles.Count) 個"
              }

              Write-Host "--- 步驟 1：比對 SHA-256 雜湊值 ---"
              foreach ($shaFile in $shaFiles) {
                  Assert-Sha256File -ShaPath $shaFile.FullName
              }

              Write-Host "--- 步驟 2：驗證 .exe 與 SBOM 的 Attestation ---"
              foreach ($asset in Get-ChildItem -LiteralPath $verifyDir -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.spdx.json' }) {
                  Invoke-WithRetry -Description "驗證 $($asset.Name) 的 Attestation" -Action {
                      gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY
                  }
                  Write-Host " [Attestation 驗證通過] $($asset.Name)"
              }

              Write-Host "=== 草稿 Release 端對端資產驗證全數通過！==="
          }
          finally {
              Remove-Item -LiteralPath $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Publish Verified Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) {
              throw "公開 Release $env:RELEASE_TAG 失敗"
          }
          Write-Host "Release $env:RELEASE_TAG 已驗證並公開發布"
