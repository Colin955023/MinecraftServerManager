name: Build and Create Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}

permissions:
  contents: read

jobs:
  preflight:
    name: 發布前置輕量預檢 (Preflight)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.extract_notes.outputs.tag_name }}
      version: ${{ steps.extract_notes.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract version and verify CHANGELOG
        id: extract_notes
        shell: pwsh
        run: ./scripts/extract_release_notes.ps1 -Strict

      - name: Verify Tag Availability
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.extract_notes.outputs.tag_name }}
        run: |
          git fetch --tags --force
          $tag = $env:RELEASE_TAG
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
              Write-Error "Preflight 失敗：無法取得當前 HEAD commit"
              exit 1
          }

          $existingTagCommit = git rev-parse -q --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0) {
              if ($existingTagCommit.Trim() -ne $headCommit) {
                  Write-Error "Preflight 失敗：Tag $tag 已存在且指向不同 commit ($($existingTagCommit.Trim()))，請更新版本號！"
                  exit 1
              }
              Write-Host "Tag $tag 已存在且指向當前 HEAD，允許發布覆蓋/更新。"
          } else {
              Write-Host "Tag $tag 尚未建立，可安全建立新標籤發布。"
          }

  gitleaks:
    name: 隱私與機密資訊檢查 (Gitleaks)
    needs: preflight
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 隱私與機密資訊檢查 (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Publish and Attest (.NET 10)
    needs: [preflight, gitleaks]
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      version: ${{ steps.release_info.outputs.version }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DOTNET_CLI_FORCE_UTF8_ENCODING: "1"

    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/**/*.csproj
            tests/**/*.csproj

      - name: Extract version and release notes
        id: release_info
        shell: pwsh
        run: .\scripts\extract_release_notes.ps1 -Strict

      - name: Run C# Quality Gate
        shell: pwsh
        run: .\scripts\dotnet_quality_gate.ps1

      - name: Publish Dual Executables (Self-contained & Framework-dependent)
        shell: pwsh
        run: .\scripts\dotnet_publish.ps1

      - name: Verify Release Artifacts in output
        shell: pwsh
        run: |
          $outputDir = "output"
          if (-not (Test-Path $outputDir)) {
              throw "輸出目錄不存在: $outputDir"
          }

          Write-Host "發布目錄驗證完成，檔案列表："
          Get-ChildItem -Path $outputDir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Attest release executable provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "output/*.exe"

      - name: Verify generated attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Get-ChildItem -Path 'output' -Filter '*.exe' -File | ForEach-Object {
              gh attestation verify $_.FullName --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Artifact attestation verification failed: $($_.Name)" }
          }

      - name: Export SLSA provenance for GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Get-ChildItem -Path 'output' -Filter '*.exe' -File | ForEach-Object {
              $exe = $_
              $tempDir = Join-Path $env:RUNNER_TEMP ("attestation-" + [guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Path $tempDir -Force | Out-Null

              Push-Location $tempDir
              try {
                  gh attestation download $exe.FullName `
                    --repo $env:GITHUB_REPOSITORY `
                    --predicate-type 'https://slsa.dev/provenance/v1' `
                    --limit 1
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to download SLSA provenance: $($exe.Name)"
                  }

                  $bundles = @(Get-ChildItem -Path $tempDir -Filter '*.jsonl' -File)
                  if ($bundles.Count -ne 1) {
                      throw "Expected exactly one SLSA provenance bundle for $($exe.Name), found $($bundles.Count)"
                  }

                  $destination = Join-Path $exe.DirectoryName ($exe.Name + '.intoto.jsonl')
                  Copy-Item -Path $bundles[0].FullName -Destination $destination -Force
              }
              finally {
                  Pop-Location
                  Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Generate SBOM (SPDX 2.2)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          SBOM_TOOL_VERSION: v4.1.5
          SBOM_TOOL_SHA256: 625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5
        run: |
          # 釘選 Microsoft SBOM Tool 固定發行版本與 SHA-256 雜湊，確保建置可重現性與防篡改
          $versionTag = $env:SBOM_TOOL_VERSION
          $expectedSha = $env:SBOM_TOOL_SHA256.ToUpperInvariant()
          $downloadUrl = "https://github.com/microsoft/sbom-tool/releases/download/$versionTag/sbom-tool-win-x64.exe"

          $sbomToolPath = Join-Path $env:RUNNER_TEMP "sbom-tool-win-x64.exe"
          Write-Host "正在下載 Microsoft SBOM Tool $versionTag..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $sbomToolPath
          $actualSha = (Get-FileHash -LiteralPath $sbomToolPath -Algorithm SHA256).Hash
          if ($actualSha -ne $expectedSha) {
              Remove-Item -LiteralPath $sbomToolPath -Force
              throw "SBOM Tool SHA-256 不符：預期 $expectedSha，實際 $actualSha"
          }

          $version = $env:RELEASE_VERSION
          Write-Host "正在為版本 $version 產生 SPDX 2.2 SBOM..."
          & $sbomToolPath generate -b "output" -bc "src" -pn "MinecraftServerManager" -pv $version -ps "Colin955023" -nsb "https://github.com/Colin955023/MinecraftServerManager" -mi "SPDX:2.2"
          if ($LASTEXITCODE -ne 0) {
              throw "SBOM 產生失敗"
          }

          # 不假設輸出子目錄名稱（會隨工具版本變動），改以檔名搜尋，並驗證實際的 spdxVersion
          $spdxFile = Get-ChildItem -Path "output/_manifest" -Recurse -Filter "manifest.spdx.json" -File | Select-Object -First 1
          if ($null -eq $spdxFile) {
              throw "SPDX 清單檔案未產生"
          }
          $spdxVersion = (Get-Content -LiteralPath $spdxFile.FullName -Raw | ConvertFrom-Json).spdxVersion
          if ($spdxVersion -ne "SPDX-2.2") {
              throw "SBOM 格式版本不符：預期 SPDX-2.2，實際 $spdxVersion"
          }

          $destSbom = "output/MinecraftServerManager.spdx.json"
          Copy-Item -LiteralPath $spdxFile.FullName -Destination $destSbom -Force
          Remove-Item -Path "output/_manifest" -Recurse -Force
          $hash = Get-FileHash -LiteralPath $destSbom -Algorithm SHA256
          Set-Content -LiteralPath "$destSbom.sha256" -Value "$($hash.Hash)  MinecraftServerManager.spdx.json" -Encoding UTF8
          Write-Host "SBOM 與 SHA-256 產生完成: $destSbom (SBOM Tool $versionTag)"

      - name: Upload release payload
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release_payload
          path: |
            output/
            release_notes.md
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish Release
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release_payload
          path: .

      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'master') {
              Write-Error "此 workflow 只能在 master 分支上手動執行，目前是 $env:GITHUB_REF_NAME"
              exit 1
          }

          git fetch --tags --force
          $tag = $env:RELEASE_TAG
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
              Write-Error "無法取得目前 commit"
              exit 1
          }

          $existingTagCommit = git rev-parse -q --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0) {
              if ($existingTagCommit.Trim() -ne $headCommit) {
                  Write-Error "Tag $tag 已存在，但指向不同 commit；請改用新版本號"
                  exit 1
              }

              Write-Host "Tag already exists and matches HEAD: $tag"
              exit 0
          }

          $tagRequest = @{
              tag = $tag
              message = $tag
              object = $headCommit
              type = 'commit'
          } | ConvertTo-Json -Compress
          $tagResponseJson = $tagRequest | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" --input -
          if ($LASTEXITCODE -ne 0) {
              Write-Error "建立 annotated tag object 失敗：$tag"
              exit $LASTEXITCODE
          }

          $tagResponse = $tagResponseJson | ConvertFrom-Json
          if (-not $tagResponse.sha) {
              Write-Error "GitHub API 未回傳 tag object SHA：$tag"
              exit 1
          }

          $refRequest = @{
              ref = "refs/tags/$tag"
              sha = $tagResponse.sha
          } | ConvertTo-Json -Compress
          $null = $refRequest | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" --input -
          if ($LASTEXITCODE -ne 0) {
              Write-Error "建立 tag ref 失敗：$tag"
              exit $LASTEXITCODE
          }

          Write-Host "Created annotated tag: $tag -> $headCommit"

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $prereleaseArgs = @()
          if ($tag -match '^\d+\.\d+\.\d+-') { $prereleaseArgs += '--prerelease' }
          $assets = Get-ChildItem -Path 'output' -File | Where-Object {
              $_.Name -match '^MinecraftServerManager.*\.exe$' -or
              $_.Name -match '^MinecraftServerManager.*\.exe\.sha256$' -or
              $_.Name -match '^MinecraftServerManager.*\.exe\.intoto\.jsonl$' -or
              $_.Name -match '^MinecraftServerManager.*\.spdx\.json$' -or
              $_.Name -match '^MinecraftServerManager.*\.spdx\.json\.sha256$'
          } | ForEach-Object { $_.FullName }
          if (-not $assets -or $assets.Count -eq 0) {
              Write-Error "No release executable was found in output."
              exit 1
          }
          $ghArgs = @('release', 'create', $tag) + $assets + @(
              '--title', "Minecraft Server Manager $tag",
              '--notes-file', 'release_notes.md',
              '--verify-tag'
          ) + $prereleaseArgs

          Write-Host "Executing: gh $ghArgs"
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
              Write-Error "GitHub CLI failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Verify Published Release Assets End-to-End
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          Write-Host "=== 開始對已發布 Release $tag 進行端對端資產驗證 ==="
          $verifyDir = Join-Path $env:RUNNER_TEMP "release-verify"
          if (Test-Path -LiteralPath $verifyDir) {
              Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null

          try {
              Write-Host "正在自 GitHub Release 下載資產至驗證目錄..."
              $downloadSuccess = $false
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  gh release download $tag --dir $verifyDir --repo $env:GITHUB_REPOSITORY
                  if ($LASTEXITCODE -eq 0) {
                      $downloadSuccess = $true
                      break
                  }
                  Write-Warning "下載 Release $tag 資產失敗 (第 $attempt 次嘗試)，等候重試..."
                  Start-Sleep -Seconds ($attempt * 2)
              }
              if (-not $downloadSuccess) {
                  throw "下載 Release $tag 資產失敗"
              }

              $downloadedFiles = Get-ChildItem -LiteralPath $verifyDir -File
              Write-Host "成功下載 $($downloadedFiles.Count) 個發布資產："
              $downloadedFiles | Select-Object Name, Length | Format-Table -AutoSize

              $exeFiles = @(Get-ChildItem -LiteralPath $verifyDir -Filter '*.exe' -File)
              if ($exeFiles.Count -eq 0) {
                  throw "驗證失敗：Release 中未找到任何 .exe 執行檔"
              }

              $shaFiles = @(Get-ChildItem -LiteralPath $verifyDir -Filter '*.sha256' -File)
              if ($shaFiles.Count -eq 0) {
                  throw "驗證失敗：Release 中未找到任何 .sha256 雜湊檔"
              }

              Write-Host "--- 步驟 1：比對 SHA-256 雜湊值 ---"
              foreach ($shaFile in $shaFiles) {
                  $shaContent = (Get-Content -LiteralPath $shaFile.FullName -Raw).Trim()
                  if ($shaContent -match '^([0-9a-fA-F]{64})\s+[\*]?(.*)$') {
                      $expectedHash = $Matches[1].ToUpperInvariant()
                      $targetFileName = $Matches[2].Trim()
                      $targetFile = Join-Path $verifyDir $targetFileName

                      if (-not (Test-Path -LiteralPath $targetFile -PathType Leaf)) {
                          throw "雜湊校驗失敗：$($shaFile.Name) 指定的檔案不存在 ($targetFileName)"
                      }

                      $actualHash = (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256).Hash.ToUpperInvariant()
                      if ($actualHash -ne $expectedHash) {
                          throw "雜湊校驗不符：$targetFileName 預期 $expectedHash，實際 $actualHash"
                      }
                      Write-Host " [SHA256 驗證通過] $targetFileName ($actualHash)"
                  } else {
                      throw "無法解析雜湊檔格式: $($shaFile.Name) 內容為: $shaContent"
                  }
              }

              Write-Host "--- 步驟 2：驗證 .exe 的 GitHub SLSA Attestation ---"
              foreach ($exe in $exeFiles) {
                  Write-Host "正在驗證 $($exe.Name) 的簽章證明..."
                  gh attestation verify $exe.FullName --repo $env:GITHUB_REPOSITORY
                  if ($LASTEXITCODE -ne 0) {
                      throw "Release 資產 Attestation 驗證失敗: $($exe.Name)"
                  }
                  Write-Host " [Attestation 驗證通過] $($exe.Name)"
              }

              Write-Host "--- 步驟 3：比對建置產物一致性（本地 output/ vs 遠端 Release） ---"
              if (Test-Path -LiteralPath 'output') {
                  foreach ($exe in $exeFiles) {
                      $localExe = Join-Path 'output' $exe.Name
                      if (Test-Path -LiteralPath $localExe -PathType Leaf) {
                          $localHash = (Get-FileHash -LiteralPath $localExe -Algorithm SHA256).Hash.ToUpperInvariant()
                          $remoteHash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
                          if ($localHash -ne $remoteHash) {
                              throw "一致性校驗失敗：$($exe.Name) 本地建置雜湊 ($localHash) 與 Release 遠端雜湊 ($remoteHash) 不符！"
                          }
                          Write-Host " [工作區一致性驗證通過] $($exe.Name)"
                      }
                  }
              }

              Write-Host "=== 發布後端對端資產驗證全數通過！==="
          }
          finally {
              Remove-Item -LiteralPath $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          }
