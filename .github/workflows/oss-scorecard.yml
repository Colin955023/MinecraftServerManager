name: "OpenSSF Scorecard 安全性評分"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: "檢出儲存庫"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "執行 Scorecard 分析"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0 (Scorecard v5.5.0)
        with:
          results_file: openossf_scorecard_report.sarif
          results_format: sarif
          publish_results: true

      - name: "上傳至 GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: openossf_scorecard_report.sarif
          category: "OpenSSF Scorecard"
