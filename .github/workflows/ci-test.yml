name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/ci-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/ci-test.yml'
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  quality:
    name: C# Quality & Tests (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      DOTNET_CLI_FORCE_UTF8_ENCODING: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/**/*.csproj
            tests/**/*.csproj

      - name: 隱私與機密資訊檢查 (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: C# 品質門禁 (Restore, Format, Build, Tests)
        run: pwsh -NoProfile -File scripts/dotnet_quality_gate.ps1

      - name: 雙版本單一 EXE 發布驗證
        run: pwsh -NoProfile -File scripts/dotnet_publish.ps1 -Configuration Release -Runtime win-x64

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-test-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 2
