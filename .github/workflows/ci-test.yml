name: CI-Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  bandit-scan:
    name: CI-Tests / Bandit Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          uv-sync: 'true'
          uv-groups: '--group security'

      - name: Run Bandit security scan
        run: |
          uv run bandit -r src tests scripts report -f sarif -o bandit-results.sarif --severity-level medium --confidence-level high

      - name: Upload Bandit SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          sarif_file: bandit-results.sarif
          category: bandit
          ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  detect-secrets-scan:
    name: CI-Tests / detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          uv-sync: 'true'
          uv-groups: '--group security'

      - name: Run detect-secrets privacy scan
        run: >-
          git ls-files -z
          | xargs -0 uv run detect-secrets-hook
          --baseline scripts/.secrets.baseline
          --exclude-files 'scripts[\\/]\.secrets\.baseline'

  lint:
    name: CI-Tests / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          uv-sync: 'true'
          uv-groups: '--group lint --group typecheck'

      - name: Run Ruff (Lint & Format)
        run: uv run ruff check src tests scripts report && uv run ruff format --check src tests scripts report

      - name: Run mypy
        run: uv run mypy

      - name: Run Pylint (cyclic import check)
        run: uv run pylint --disable=all --enable=cyclic-import src

      - name: Run import architecture checks
        run: |
          uv run lint-imports
          uv run python scripts/check_import_boundaries.py

      - name: Compile first-party Python sources
        run: uv run python -m compileall -q src tests scripts report

  test:
    name: CI-Tests / test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          uv-sync: 'true'
          uv-groups: '--group test'

      - name: Run tests (pytest)
        run: uv run pytest -q --junitxml=pytest-results.xml

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest_junit_report_windows
          path: pytest-results.xml
          retention-days: 2
