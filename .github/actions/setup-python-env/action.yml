name: 'Setup Python Environment'
description: 'Sets up Python, installs uv, and optionally syncs dependencies with uv. Note: You must run actions/checkout before using this action.'

inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.14'
  uv-sync:
    description: 'Whether to run `uv sync` to install dependencies. Set to "true" to run.'
    required: false
    default: 'false'
  uv-groups:
    description: 'Additional uv dependency-group arguments, for example: --group test'
    required: false
    default: ''

outputs:
  python-version:
    description: 'Installed Python version'
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - id: setup-python
      name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        enable-cache: true

    - name: Install dependencies
      if: ${{ inputs.uv-sync == 'true' }}
      shell: bash
      run: uv sync --locked ${{ inputs.uv-groups }}