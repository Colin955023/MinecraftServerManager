[project]
name = "minecraft-server-manager"
dynamic = ["version"]
description = "Minecraft 伺服器管理器"
readme = "README.md"
requires-python = ">=3.14, <3.15"
license = { file = "LICENSE" }

dependencies = [
  "PySide6>=6.11.2",
  "PySide6-Fluent-Widgets>=1.11.3",
  "httpx[http2]>=0.28.1",
  "defusedxml>=0.7.1",
  "packaging>=26.3",
  "loguru>=0.7.3",
  "orjson>=3.12.0",
  "psutil>=7.2.2"
]

[dependency-groups]
build = [
  "nuitka>=4.2",
  "zstandard>=0.25.0",
]

test = [
  "pytest>=9.1.1",
]

lint = [
  "ruff>=0.16.5",
  "vulture>=2.16",
  "pylint>=4.0.7",
  "import-linter>=2.13",
]

typecheck = [
  "mypy>=2.3.1",
  "types-psutil>=7.2.2.20260827",
]

security = [
  "bandit>=1.9.4",
  "bandit-sarif-formatter>=1.1.1",
  "detect-secrets>=1.5.0",
]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "分層依賴方向（右方為底層，禁止反向匯入）"
type = "layers"
layers = [
    "src.ui",
    "src.core",
    "src.models",
    "src.utils",
]

[tool.mypy]
files = ["src", "tests", "scripts", "report"]
python_version = "3.14"
ignore_missing_imports = false
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
platform = "win32"

[[tool.mypy.overrides]]
module = ["defusedxml", "qfluentwidgets.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "I",
  "E",
  "F",
  "W",
  "UP",
  "B",
  "C4",
  "SIM",
  "PIE",
  "T20",
  "RET",
  "ARG",
  "ERA",
  "RUF",
  "PTH",
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
"scripts/version_check.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.vulture]
paths = ["src", "tests", "scripts", "report"]
min_confidence = 60
sort_by_size = true
ignore_names = [
  "APP_DESCRIPTION",
  "adaptive_sizing",
  "auto_center",
  "dwFlags",
  "remember_size_position",
  "return_value",
  "wShowWindow",
]
ignore_decorators = [
  "@pytest.fixture",
]

[tool.setuptools.dynamic]
version = {attr = "src.utils.runtime_utils.app_info.APP_VERSION"}

[tool.uv]
managed = true
package = false
required-version = ">=0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: minimal smoke coverage for core flows",
  "integration: focused integration coverage for key UI/business flows",
]
