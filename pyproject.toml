[project]
name = "minecraft-server-manager"
dynamic = ["version"]
description = "Minecraft 伺服器管理器"
readme = "README.md"
requires-python = ">=3.14, <3.15"
license = { file = "LICENSE" }

dependencies = [
  "PySide6>=6.11.1",
  "PySide6-Fluent-Widgets>=1.11.3",
  "httpx[http2]>=0.28.1",
  "defusedxml>=0.7.1",
  "packaging>=26.3",
  "loguru>=0.7.3",
  "openpyxl>=3.1.5",
  "orjson>=3.12.0",
  "psutil>=7.2.2",
  "py-spy>=0.4.2"
]

[dependency-groups]
build = [
  "nuitka>=4.1.3",
]

test = [
  "pytest>=9.1.1",
]

lint = [
  "ruff>=0.16.3",
  "vulture>=2.16",
  "pylint>=4.0.7",
  "import-linter>=2.13",
]

typecheck = [
  "mypy>=2.3.1",
  "types-toml>=0.10.8.20260518",
  "types-openpyxl>=3.1.5.20260807",
  "types-psutil>=7.2.2.20260518",
]

security = [
  "bandit>=1.9.4",
  "bandit-sarif-formatter>=1.1.1",
  "detect-secrets>=1.5.0",
]

tools = [
  "uv>=0.12.5",
]

[project.scripts]
minecraft-server-manager = "src.main:main"

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "分層依賴方向（右方為底層，禁止反向匯入）"
type = "layers"
layers = [
    "src.ui",
    "src.core",
    "src.models",
    "src.utils",
]

[tool.mypy]
ignore_missing_imports = false
check_untyped_defs = true
platform = "win32"

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "qfluentwidgets.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]
extend-exclude = ["report", "assets"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "I",
  "E",
  "F",
  "W",
  "UP",
  "B",
  "C4",
  "SIM",
  "PIE",
  "T20",
  "RET",
  "ARG",
  "ERA",
  "RUF",
  "PTH",
]
ignore = ["E402", "B023", "E501", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.setuptools.dynamic]
version = {attr = "src.utils.runtime_utils.app_info.APP_VERSION"}

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: minimal smoke coverage for core flows",
  "integration: focused integration coverage for key UI/business flows",
]
